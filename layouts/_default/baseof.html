<!DOCTYPE html>
<html lang="en" data-theme="tomsmith" class="scroll-smooth">
    {{ partial "head.html" . }}
    <body class="bg-base-100 text-base-content font-sans">
        {{ partial "header.html" . }}
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer.html" . }}
        <div id="cookie-banner" class="fixed bottom-0 left-0 z-50 w-full p-4 hidden">
            <div class="max-w-screen-lg mx-auto flex flex-col md:flex-row md:items-center gap-4 p-5 md:p-6 bg-base-100 border border-base-300 rounded-xl shadow-airbnb">
                <div class="flex-1">
                    <h3 class="text-lg font-semibold mb-1">Privacy &amp; Cookies</h3>
                    <p class="text-sm text-base-content/70">We use essential cookies to make this site work. With your consent we use additional cookies for analytics. Review our <a href="/privacy-policy/" class="link-ink text-base-content">Privacy Policy</a>.</p>
                </div>
                <div class="flex items-center gap-2">
                    <button id="cookie-decline" type="button" class="btn-line btn-sm h-10 min-h-10 px-5">Decline</button>
                    <button id="cookie-accept" type="button" class="btn btn-neutral btn-sm h-10 min-h-10 px-5">Accept</button>
                </div>
            </div>
        </div>
        <button id="cookie-manage" class="cookie-manage-btn hidden" type="button">Cookie Preferences</button>
        <script>
            (function () {
                const navbar = document.getElementById('navbar');
                if (!navbar) return;
                const apply = () => {
                    navbar.classList.toggle('shadow-airbnb-sm', window.scrollY > 10);
                };
                apply();
                window.addEventListener('scroll', apply, { passive: true });

                // Close the mobile menu when clicking outside of it
                const mobileMenu = document.getElementById('mobile-menu');
                if (mobileMenu) {
                    document.addEventListener('click', (event) => {
                        if (mobileMenu.open && !mobileMenu.contains(event.target)) {
                            mobileMenu.removeAttribute('open');
                        }
                    });
                }
            })();
        </script>
        <script>
            // Image preloader: reveal media and hide the frame's spinner once it has loaded
            (function () {
                const markLoaded = (el) => {
                    const frame = el.closest('.media-frame');
                    if (frame) frame.classList.add('is-loaded');
                };
                document.querySelectorAll('[data-preload]').forEach((el) => {
                    if (el.tagName === 'VIDEO') {
                        if (el.readyState >= 2) return markLoaded(el);
                        el.addEventListener('loadeddata', () => markLoaded(el), { once: true });
                    } else {
                        if (el.complete) return markLoaded(el);
                        el.addEventListener('load', () => markLoaded(el), { once: true });
                    }
                    el.addEventListener('error', () => markLoaded(el), { once: true });
                });
            })();
        </script>
        <script>
            (function () {
                const banner = document.getElementById('cookie-banner');
                const manageBtn = document.getElementById('cookie-manage');
                const acceptBtn = document.getElementById('cookie-accept');
                const declineBtn = document.getElementById('cookie-decline');
                if (!banner || !manageBtn || !acceptBtn || !declineBtn) return;

                const showBanner = () => {
                    banner.classList.remove('hidden');
                    manageBtn.classList.add('hidden');
                };
                const hideBanner = () => {
                    banner.classList.add('hidden');
                    manageBtn.classList.remove('hidden');
                };
                const saveConsent = (value) => {
                    localStorage.setItem('cookieConsent', value);
                    window.cookieConsent = value;
                    if (value === 'accepted' && typeof window.loadAnalytics === 'function') {
                        window.loadAnalytics();
                    }
                };

                const storedConsent = localStorage.getItem('cookieConsent');
                if (!storedConsent) {
                    showBanner();
                } else {
                    hideBanner();
                }

                acceptBtn.addEventListener('click', () => {
                    saveConsent('accepted');
                    hideBanner();
                });

                declineBtn.addEventListener('click', () => {
                    saveConsent('declined');
                    hideBanner();
                });

                manageBtn.addEventListener('click', () => {
                    showBanner();
                });
            })();
        </script>
    </body>
</html>
