<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }}</title>
    <link rel="stylesheet" href="/css/tailwind.css">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Mona+Sans:wght@400..800&display=swap" rel="stylesheet">
    <noscript><style>[data-preload]{opacity:1!important}.media-frame::after{display:none!important}</style></noscript>
    <!-- Meta Description -->
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}Tom Smith is a 'Jack-of-All-Trades', Full-Stack Designer– capable of shipping products and solving abstract creative problems.{{ end }}">
    <!-- Open Graph Meta Tags -->
    <meta property="og:title" content="{{ .Title }} | {{ .Site.Title }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}Tom Smith is an entrepreneurial creative leader based in Portland, Maine.{{ end }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:image" content="{{ with .Params.ogimage }}{{ . }}{{ else }}/images/default-og-image.jpg{{ end }}">
    <meta name="theme-color" content="#FFFFFF">

    <!-- Prevent AI Training -->

    <meta name="robots" content="noai, noimageai">

    <script>
    window.cookieConsent = localStorage.getItem('cookieConsent');
    window.analyticsLoaded = false;
    window.loadAnalytics = function () {
        if (window.analyticsLoaded) return;
        var gtagScript = document.createElement('script');
        gtagScript.async = true;
        gtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-RQJTLR2P7S';
        document.head.appendChild(gtagScript);

        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        window.gtag = gtag;
        gtag('js', new Date());
        gtag('config', 'G-RQJTLR2P7S');
        gtag('config', 'AW-476100042');
        window.analyticsLoaded = true;
    };
    if (window.cookieConsent === 'accepted') {
        window.loadAnalytics();
    }
    </script>

    <meta property="og:site_name" content="{{ .Site.Title }}">
    <!-- GLightbox CSS -->
    <link href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" rel="stylesheet" />
    
    <!-- GLightbox JS -->
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
    <style>
        .cookie-manage-btn{
            position:fixed;
            bottom:1rem;
            left:1rem;
            background:#fff;
            color:#222;
            border:1px solid #ddd;
            box-shadow:0 6px 16px rgba(0,0,0,0.12);
            border-radius:999px;
            padding:0.4rem 1.2rem;
            font-size:0.85rem;
            font-weight:500;
            cursor:pointer;
            z-index:900;
        }
        .cookie-manage-btn.hidden{
            display:none;
        }
        .gallery-card{
            display:block;
            width:100%;
            position:relative;
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            overflow:hidden;
            padding-bottom:var(--aspect,130%);
        }
        /* GLightbox description tweaks */
        .glightbox-container .gdesc-inner,
        .glightbox-container .gdesc-inner .gslide-desc,
        .glightbox-container .gdesc-inner .gslide-title{
            background:#fff !important;
            color:#222 !important;
            box-shadow:none !important;
        }
    </style>
</head>
